name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without a new commit.
  workflow_dispatch:

# Pages needs these; the default token is read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, but queue at most
# one more so a burst of pushes does not pile up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type-checks what it bundles, then builds. `npm run lint` is left out
      # on purpose: the vendored components still carry warnings that are not
      # worth failing a deploy over.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
